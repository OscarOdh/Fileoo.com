# File Upload Configuration
# Keep in sync with MAX_FILE_SIZE in config.php (150 MB)
upload_max_filesize = 150M
post_max_size = 150M

# 1. Error logging: Log errors to server-side logs, do not display raw errors to visitors
display_errors = Off
log_errors = On

# 2. Hide PHP version header (X-Powered-By) to prevent environment fingerprinting
expose_php = Off

# 3. Session security hardening
# (cookie_secure is set dynamically in config.php so local HTTP still works)
session.cookie_httponly = On
session.use_only_cookies = On
session.cookie_samesite = Lax
session.use_strict_mode = On
